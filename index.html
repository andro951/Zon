        function loadScriptsSequentially(scripts, callback) {
        let i = 0;
        function next() {
            if (i >= scripts.length) {
            if (callback) callback();
            return;
            }
            const s = document.createElement('script');
            s.src = scripts[i];
            s.onload = () => { i++; next(); };
            s.onerror = () => console.error('Failed to load:', scripts[i]);
            document.body.appendChild(s);
        }
        next();
        }
